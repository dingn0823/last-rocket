<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ship AI · Last Rocket to the Moon</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display: grid; place-items: center; }
    .phone {
      width: min(420px, 100vw); height: min(860px, 100dvh); display: flex; flex-direction: column;
      background: #000; border: 1px solid #222; border-radius: 36px; overflow: hidden; box-shadow: 0 30px 80px #0008;
    }
    @media (max-width: 480px) { .phone { border-radius: 0; border: 0; height: 100dvh; } }
    header {
      display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; padding: 14px 12px 10px;
      background: rgba(28, 28, 30, 0.92); border-bottom: 1px solid #2c2c2e;
    }
    header .who { text-align: center; }
    header .avatar {
      width: 44px; height: 44px; margin: 0 auto 4px; border-radius: 50%; display: grid; place-items: center; font-size: 24px;
      background: linear-gradient(135deg, #1f3a8a, #6b2bd9);
    }
    header .name { font-size: 12px; color: #f2f2f7; }
    header .sub { font-size: 10px; color: #8e8e93; }
    header button, header a {
      background: none; border: 0; color: var(--blue); font-size: 13px; text-decoration: none; text-align: center;
    }
    #log { flex: 1; overflow-y: auto; padding: 12px 12px 4px; display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; }
    .row.in { justify-content: flex-start; }
    .row.me { justify-content: flex-end; }
    .bubble {
      max-width: 78%; padding: 8px 13px; border-radius: 18px; font-size: 15.5px; line-height: 1.32; white-space: pre-wrap; word-wrap: break-word;
      animation: pop .18s ease-out;
    }
    .in .bubble { background: #26262a; color: #fff; border-bottom-left-radius: 5px; }
    .me .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 5px; }
    .me img.photo { max-width: 62%; border-radius: 16px; display: block; }
    @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
    .typing { display: inline-flex; gap: 4px; padding: 12px 14px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: #8e8e93; animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

    .scene {
      width: 78%; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse at 30% 20%, #2a3d8f, #0b0f2a 70%);
      padding: 18px 14px 12px; text-align: center; animation: pop .2s ease-out; border: 1px solid #ffffff14;
    }
    .scene .icon { font-size: 54px; filter: drop-shadow(0 0 18px #7aa2ff88); }
    .scene .title { font-size: 11px; letter-spacing: .14em; color: #b9c6ff; margin-top: 8px; font-weight: 700; }

    .card {
      width: 80%; border-radius: 18px; padding: 12px; animation: pop .2s ease-out; position: relative;
      background: linear-gradient(160deg, #0f1a3a, #111122); border: 1px solid var(--cyan); box-shadow: 0 0 18px #4ff3ff33 inset;
    }
    .card.rare { border-color: #5a8cff; box-shadow: 0 0 18px #5a8cff44 inset; }
    .card.legendary { border-color: var(--gold); box-shadow: 0 0 24px #ffd76a55 inset; }
    .card .top { display: flex; gap: 10px; align-items: center; }
    .card .gicon { font-size: 34px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; background: #ffffff0d; }
    .card .gname { font-weight: 800; font-size: 16px; }
    .card .gsub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
    .card .thumb { position: absolute; top: 10px; right: 10px; width: 46px; height: 46px; object-fit: cover; border-radius: 10px; border: 1px solid #ffffff33; }
    .card .geffect { margin-top: 10px; font-size: 14px; color: #dfe6ff; }
    .card .gblurb { margin-top: 6px; font-size: 13px; color: var(--cyan); font-style: italic; }

    .report { width: 84%; border-radius: 18px; padding: 14px; background: linear-gradient(160deg, #1a1433, #0b0f22); border: 1px solid #ffffff22; animation: pop .2s; }
    .report h3 { margin: 0; letter-spacing: .12em; font-size: 20px; }
    .report .score { font-size: 34px; font-weight: 900; color: var(--gold); }
    .report .res { display: flex; gap: 12px; font-size: 13px; color: var(--muted); margin: 6px 0; }
    .report .line { font-size: 13px; margin-top: 4px; }
    .report.failure h3 { color: var(--danger); } .report.success h3 { color: #fff6d8; } .report.rescue h3 { color: var(--oxygen); }

    .sys { align-self: center; font-size: 11px; color: #8e8e93; margin: 6px 0; }
    .start { align-self: center; text-align: center; margin: 24px 0; color: #8e8e93; font-size: 13px; }
    .start div { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .start button { border: 0; border-radius: 18px; padding: 8px 18px; background: var(--blue); color: #fff; font-size: 15px; }

    footer { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: rgba(28,28,30,.92); border-top: 1px solid #2c2c2e; }
    #preview { display: none; align-items: center; gap: 8px; padding: 0 4px 8px; font-size: 12px; color: #8e8e93; }
    #preview img { height: 48px; border-radius: 8px; }
    #preview button { background: #3a3a3c; color: #fff; border: 0; border-radius: 10px; padding: 2px 8px; }
    form { display: flex; gap: 8px; align-items: center; }
    .cam { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #3a3a3c; color: #fff; font-size: 17px; flex: none; }
    #text { flex: 1; min-width: 0; height: 36px; border-radius: 18px; border: 1px solid #3a3a3c; background: #1c1c1e; color: #fff; padding: 0 14px; font-size: 15px; outline: none; }
    .send { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; font-size: 17px; font-weight: 900; flex: none; }
    .send:disabled { background: #3a3a3c; }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="phone">
    <header>
      <button id="reset" data-ui="newBtn">↺ New</button>
      <div class="who">
        <div class="avatar">🚀</div>
        <div class="name" data-ui="shipAi">Ship AI</div>
        <div class="sub" data-ui="simulator">iMessage simulator</div>
      </div>
      <a id="bridge" href="#" target="_blank" rel="noopener" data-ui="bridgeBtn">🖥 Bridge</a>
    </header>
    <div id="log"></div>
    <footer>
      <div id="preview"><img alt="" /><span data-ui="photoAttached">Photo attached. Add a caption or tap send.</span><button type="button" id="clearPhoto">✕</button></div>
      <form id="form" autocomplete="off">
        <button type="button" class="cam" id="camBtn" title="Send a photo">📷</button>
        <input type="file" id="file" accept="image/*" hidden />
        <input id="text" placeholder="iMessage" enterkeyhint="send" />
        <button class="send" id="sendBtn" title="Send">↑</button>
      </form>
    </footer>
  </div>
  <script type="module" src="/static/phone.js"></script>
</body>
</html>

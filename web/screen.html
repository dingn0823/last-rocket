<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Last Rocket to the Moon · Live</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    html, body { overflow: hidden; }
    body { padding: 2.2vh 2vw; height: 100vh; box-sizing: border-box; }
    .grid { height: 100%; display: grid; gap: 1.6vh 1.4vw; grid-template-columns: 1fr 27vw; grid-template-rows: auto 1fr 26vh; grid-template-areas: "top top" "route side" "board side"; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 1.8vh 1.4vw; backdrop-filter: blur(6px); min-height: 0; }
    h2 { margin: 0 0 1.2vh; font-size: 1.3vh; letter-spacing: .24em; color: var(--muted); font-weight: 800; }

    .top { grid-area: top; display: flex; align-items: center; justify-content: space-between; }
    .top h1 { margin: 0; font-size: 3.4vh; letter-spacing: .16em; font-weight: 900; }
    .counts { display: flex; gap: 2.4vw; font-size: 2.4vh; font-weight: 800; }
    .counts span b { font-size: 3.6vh; margin-right: .4vw; }
    .counts .fly b { color: var(--fuel); } .counts .land b { color: #fff6d8; } .counts .lost b { color: var(--danger); }
    .live { font-size: 1.5vh; letter-spacing: .2em; color: var(--muted); display: flex; align-items: center; gap: .5vw; }
    .live i { width: 1.1vh; height: 1.1vh; border-radius: 50%; background: var(--danger); }
    .live.on i { background: var(--hull); box-shadow: 0 0 10px var(--hull); }

    /* route */
    .route { grid-area: route; position: relative; overflow: hidden; }
    .planet { position: absolute; top: 50%; transform: translateY(-50%); font-size: 14vh; z-index: 0; }
    .earth { left: -3vh; filter: drop-shadow(0 0 4vh #4f8bff88); }
    .moon { right: -3vh; filter: drop-shadow(0 0 5vh #fff5c899); }
    .col { position: absolute; top: 5%; bottom: 4%; width: 0; border-left: 2px dashed #7aa2ff33; }
    .col span { position: absolute; top: -.2vh; left: .6vw; white-space: nowrap; font-size: 1.3vh; letter-spacing: .16em; color: var(--muted); font-weight: 700; }
    .chip { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: .4vw; padding: .5vh .8vw .5vh .5vw; border-radius: 999px; background: #0d1535ee; border: 1px solid #4ff3ff55; font-size: 1.7vh; font-weight: 700; white-space: nowrap; transition: left 1.8s cubic-bezier(.5,0,.2,1), top 1.8s, opacity .6s; z-index: 2; box-shadow: 0 0 1.5vh #4ff3ff22; }
    .chip .i { font-size: 2.2vh; }
    .chip.combo { border-color: var(--violet); box-shadow: 0 0 2vh #b98cff55; }
    .chip.landed { border-color: #fff6d8; background: #2a2410ee; }
    .chip.lost { opacity: .45; border-color: var(--danger); filter: grayscale(.6); }
    .chip.new { animation: pop .8s cubic-bezier(.2,1.6,.4,1); }
    @keyframes pop { from { transform: translate(-50%, -50%) scale(.2); } }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.6vh; color: var(--muted); z-index: 1; }

    /* leaderboard */
    .board { grid-area: board; overflow: hidden; }
    .board ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: .8vh 2vw; }
    .board li { display: flex; align-items: center; gap: .8vw; font-size: 2vh; }
    .board .rank { width: 3.4vh; height: 3.4vh; border-radius: 50%; display: grid; place-items: center; background: #ffffff12; font-weight: 900; font-size: 1.7vh; }
    .board li:nth-child(1) .rank { background: var(--gold); color: #2a2000; }
    .board li:nth-child(2) .rank { background: #d8dde8; color: #222; }
    .board li:nth-child(3) .rank { background: #d99a5b; color: #2a1500; }
    .board .n { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board .s { font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
    .board .none { color: var(--muted); font-size: 1.8vh; }

    /* side */
    .side { grid-area: side; display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
    .join { text-align: center; }
    .join .qr { background: #fff; border-radius: 16px; padding: 1.2vh; width: 26vh; height: 26vh; margin: 0 auto; }
    .join .qr img { width: 100%; height: 100%; display: block; }
    .join .call { font-size: 2.2vh; font-weight: 900; margin: 1.2vh 0 .4vh; }
    .join .url { font-family: ui-monospace, Menlo, monospace; font-size: 2.3vh; color: var(--cyan); font-weight: 700; word-break: break-all; }
    .join .sub { font-size: 1.5vh; color: var(--muted); margin-top: .6vh; }
    .feed { flex: 1; overflow: hidden; }
    .feed ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1vh; }
    .feed li { display: flex; gap: .7vw; font-size: 1.85vh; line-height: 1.35; }
    .feed li.fresh { animation: slide .5s ease-out; }
    .feed li .i { font-size: 2.2vh; }
    @keyframes slide { from { transform: translateX(2vw); opacity: 0; } }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="grid">
    <div class="top">
      <h1>🚀 LAST ROCKET TO THE MOON</h1>
      <div class="counts"><span class="fly"><b id="nFly">0</b>flying</span><span class="land"><b id="nLand">0</b>landed</span><span class="lost"><b id="nLost">0</b>lost</span></div>
      <div class="live" id="live"><i></i>LIVE</div>
    </div>
    <div class="panel route" id="route">
      <div class="planet earth">🌍</div>
      <div class="planet moon">🌕</div>
      <div class="empty" id="empty">Scan the code to take the last rocket →</div>
    </div>
    <div class="panel board">
      <h2>BEST LANDINGS</h2>
      <ol id="board"></ol>
    </div>
    <div class="side">
      <div class="panel join">
        <div class="qr"><img id="qr" alt="Join QR code" /></div>
        <div class="call">Earth has hours left. Scan to board.</div>
        <div class="url" id="url"></div>
        <div class="sub">iPhone + iMessage · bring one real thing</div>
      </div>
      <div class="panel feed">
        <h2>MISSION FEED</h2>
        <ul id="feed"></ul>
      </div>
    </div>
  </div>
  <script type="module" src="/static/screen.js"></script>
</body>
</html>
